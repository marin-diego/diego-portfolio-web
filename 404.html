<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Diego Marin</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script>try{var t=localStorage.getItem('theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
  :root{--bg:#111114;--ink:#f2f2f4;--mute:#a3a3ad;--line:#2e2e34;--orange:#ff5500}
  html[data-theme=light]{--bg:#f8f7f4;--ink:#18181b;--mute:#606068;--line:#e2e0da;--orange:#d94800}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Space Grotesk",system-ui,sans-serif}
  header{padding:1.5rem}
  .brand{display:inline-flex;align-items:center;gap:.75rem;font-weight:700;color:var(--ink);text-decoration:none}
  .brand i{width:12px;height:12px;background:var(--orange)}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5rem;max-width:56rem;width:100%;margin:0 auto}
  .code{font-family:"JetBrains Mono",monospace;font-size:.8rem;color:var(--orange);letter-spacing:.08em}
  h1{margin:1rem 0 0;font-size:clamp(2.5rem,9vw,5.5rem);line-height:.98;letter-spacing:-.04em}
  p{margin:1.25rem 0 0;font-size:1.125rem;color:var(--mute);max-width:32rem;line-height:1.6}
  a.btn{display:inline-block;margin-top:2rem;padding:.9rem 1.6rem;background:var(--orange);color:var(--bg);font:500 .875rem "JetBrains Mono",monospace;text-decoration:none;align-self:flex-start}
  a.btn:hover{background:var(--ink)}
  a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
  footer{padding:1.5rem;font:.75rem "JetBrains Mono",monospace;color:var(--mute);border-top:1px solid var(--line);display:flex;justify-content:space-between}
</style>
</head>
<body>
<header><a class="brand" href="/"><i></i>Diego Marin</a></header>
<main>
  <span class="code">[ ERROR 404 ]</span>
  <h1>Off the flight path.</h1>
  <p>That page doesn't exist, or it moved.</p>
</main>
<footer><span>DIEGO MARIN // LOS ANGELES</span><span>&copy; 2026</span></footer>
</body>
</html>
