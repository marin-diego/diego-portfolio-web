<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astrophotography Catalog | Diego Marin</title>
<meta name="description" content="Full astrophotography catalog by Diego Marin, sorted by year with technique, frame counts and processing notes.">
<meta name="theme-color" content="#0A0A0C">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: { sans: ['"Space Grotesk"', 'system-ui', 'sans-serif'], mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'] },
      colors: { bg: '#0A0A0C', panel: '#18181B', line: '#27272A', ink: '#EDEDED', mute: '#8B8B94', orange: '#FF5500' }
    } }
  }
</script>
<style>
  html { scroll-behavior: smooth; scroll-padding-top: 5rem; background: #0A0A0C; }
  body { background-color: #0A0A0C; color: #EDEDED;
         background-image: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
         background-size: 56px 56px; }
  ::selection { background: #FF5500; color: #0A0A0C; }
  .h-sec { font-size: clamp(2.5rem, 5.5vw, 5rem); letter-spacing: -0.04em; line-height: .95; }
  .card { background: #18181B; border: 1px solid #27272A; transition: border-color .35s, box-shadow .35s; }
  .card:hover { border-color: #FF5500; box-shadow: 0 0 0 1px rgba(255,85,0,.3), 0 0 44px -12px rgba(255,85,0,.45); }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 11px; letter-spacing: .03em; border: 1px solid #27272A; background: #0F0F12; padding: .3rem .55rem; color: #fff; }
  .shot { position: relative; background: #000; border-right: 1px solid #27272A; display: flex; align-items: center; justify-content: center; min-height: 18rem; }
  .shot img { position: relative; z-index: 1; background: #000; width: 100%; height: auto; max-height: 80vh; object-fit: contain; display: block; cursor: zoom-in; }
  .shot .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1rem;
              font-family: "JetBrains Mono", monospace; font-size: 11px; color: #8B8B94; letter-spacing: .06em; pointer-events: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid #FF5500; outline-offset: 3px; }
  #lightbox { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.92); display: none; align-items: center; justify-content: center; padding: 1.5rem; cursor: zoom-out; }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
</style>
</head>
<body class="font-sans antialiased">

<header class="sticky top-0 z-50 bg-bg/85 backdrop-blur border-b border-line">
  <nav class="max-w-7xl mx-auto px-6 md:px-10 h-16 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-3 font-bold tracking-tight text-white"><span class="w-3 h-3 bg-orange"></span>Diego Marin</a>
    <a href="index.html#astrophotography" class="font-mono text-xs hover:text-orange">&larr; Back to portfolio</a>
  </nav>
</header>

<main class="max-w-7xl mx-auto px-6 md:px-10 pt-16 pb-24">
  <p class="font-mono text-xs text-orange">[ ASTROPHOTOGRAPHY ARCHIVE ]</p>
  <h1 class="h-sec font-bold text-white mt-4">Full catalog</h1>
  <p class="mt-6 max-w-2xl text-lg leading-relaxed text-ink/90">Every capture, newest first, with the technique, frame count, and processing behind each one.</p>

  <nav id="year-nav" class="mt-10 flex flex-wrap gap-2" aria-label="Jump to year"></nav>
  <div id="catalog"></div>
</main>

<footer class="border-t border-line">
  <div class="max-w-7xl mx-auto px-6 md:px-10 py-8 font-mono text-xs text-mute flex justify-between">
    <span>DIEGO MARIN // LOS ANGELES </span>
    <span>&copy; 2026</span>
  </div>
</footer>

<div id="lightbox" role="dialog" aria-label="Enlarged photo"><img alt=""></div>

<script>
/* ==========================================================
   CATALOG DATA: edit here.
   - Years and entries are sorted newest first automatically
     (by `date`, format YYYY-MM-DD), so order in this list
     doesn't matter.
   - To add a year, just add entries with a date in that year.
   - Photos live in assets/astro-catalog/
   ========================================================== */
const EXTS = ['jpg','jpeg','png','webp'];   // the page tries each of these for every image id
const PIPP = 'Frames were processed in PIPP, stacked in AutoStakkert!, and edited with RegiStax 6';
const ENTRIES = [
  {
    date: '2026-10-19', title: 'Saturn', id: 'saturn-10-19-26',
    notes: 'Captured Saturn on October 19th, 2026. Captured 6 different videos, around 40 seconds each. ' + PIPP + '.',
    tags: [['Technique','Stack'], ['Lens','2x Barlow'], ['Telescope','Celestron C8']]
  },
  {
    date: '2026-10-19', title: 'Moon close up of Rupes Recta', id: 'moon-close-up-1-10-19-26',
    notes: 'Captured the “Rupes Recta” region of the Moon on October 19th, 2026. 268 frames were taken of the region. ' + PIPP + '.',
    tags: [['Region','Rupes Recta'], ['Technique','Stack'], ['Frames','268'], ['Lens','2x Barlow'], ['Telescope','Celestron C8']]
  },
  {
    date: '2026-10-19', title: 'Moon close up of Mare Nubium', id: 'moon-close-up-2-10-19-26',
    notes: 'Captured the “Mare Nubium” region of the Moon on October 19th, 2026. 257 frames were taken of the region. ' + PIPP + '.',
    tags: [['Stage','First Quarter'], ['Technique','Stack and mosaic'], ['Frames','257 per section'], ['Lens','2x Barlow'], ['Telescope','Celestron C8']]
  },
  {
    date: '2026-10-18', title: 'Moon', id: 'moon-10-18-26',
    notes: 'The Moon was divided into two parts, with 210 frames taken of each. ' + PIPP + '; the two sections were then combined in Microsoft ICE to create the full image.',
    tags: [['Stage','First Quarter'], ['Technique','Stack and mosaic'], ['Frames','210 per section (2 sections)'], ['Telescope','Celestron C8']]
  },
  {
    date: '2026-10-16', title: 'Moon', id: 'moon-10-16-26', alt: ['saturn-10-16-26', 'moon-10-16-25'],   // tries both file names
    notes: 'The Moon was divided into two parts, with 60 frames taken of each. ' + PIPP + '; the two sections were then combined in Microsoft ICE to create the full image.',
    tags: [['Stage','Waxing Crescent'], ['Technique','Stack and mosaic'], ['Frames','60 per section (2 sections)'], ['Telescope','Celestron C8']]
  }
];

const MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => { const [y, m, day] = d.split('-').map(Number); return MONTHS[m - 1] + ' ' + day + ', ' + y; };

// tries every extension for the image id (and any alt ids); removes the img if none exist
const candidates = e => [e.id, ...(e.alt || [])].flatMap(n => EXTS.map(x => 'assets/astro-catalog/' + n + '.' + x));
function tryNext(img) {
  const list = JSON.parse(img.dataset.list), i = Number(img.dataset.i) + 1;
  if (i >= list.length) { img.remove(); return; }
  img.dataset.i = i; img.src = list[i];
}
window.tryNext = tryNext;

const sorted = [...ENTRIES].sort((a, b) => b.date.localeCompare(a.date));
const years = [...new Set(sorted.map(e => e.date.slice(0, 4)))];

document.getElementById('year-nav').innerHTML = years.map(y =>
  '<a href="#y' + y + '" class="pill hover:border-orange hover:text-orange">' + y + '</a>').join('');

document.getElementById('catalog').innerHTML = years.map(y => {
  const items = sorted.filter(e => e.date.startsWith(y));
  return '<section id="y' + y + '" class="mt-16">' +
    '<h2 class="font-mono text-sm text-orange border-b border-line pb-4">[ ' + y + ' ]</h2>' +
    items.map(e =>
      '<article class="card grid md:grid-cols-12 mt-8">' +
        '<div class="shot md:col-span-7"><span class="ph">[ ' + esc(e.title) + ' ]</span>' +
          '<img data-list=\'' + esc(JSON.stringify(candidates(e))).replace(/\'/g, "&#39;") + '\' data-i="0" src="' + esc(candidates(e)[0]) + '" alt="' + esc(e.title + ', ' + fmt(e.date)) + '" loading="lazy" onerror="tryNext(this)"></div>' +
        '<div class="md:col-span-5 p-6 md:p-10 flex flex-col">' +
          '<p class="font-mono text-xs text-orange">' + fmt(e.date) + '</p>' +
          '<h3 class="mt-3 text-3xl font-bold tracking-tight text-white">' + esc(e.title) + '</h3>' +
          '<p class="mt-4 leading-relaxed text-ink">' + esc(e.notes) + '</p>' +
          '<div class="mt-auto pt-8"><p class="font-mono text-[11px] text-mute mb-3">DETAILS</p><div class="flex flex-wrap gap-2">' +
            e.tags.map(t => '<span class="pill">[ <span class="text-mute">' + esc(t[0].toUpperCase()) + ':</span> ' + esc(t[1].toUpperCase()) + ' ]</span>').join('') +
          '</div><p class="font-mono text-[10px] text-mute mt-4">IMAGE ID: ' + esc(e.id) + '</p></div>' +
        '</div>' +
      '</article>').join('') +
    '</section>';
}).join('');

// click a photo to enlarge
const lb = document.getElementById('lightbox'), lbImg = lb.querySelector('img');
document.getElementById('catalog').addEventListener('click', e => {
  if (e.target.matches('.shot img')) { lbImg.src = e.target.src; lbImg.alt = e.target.alt; lb.classList.add('open'); }
});
lb.addEventListener('click', () => lb.classList.remove('open'));
document.addEventListener('keydown', e => { if (e.key === 'Escape') lb.classList.remove('open'); });
</script>
</body>
</html>
